[project]
name = "aico"
version = "0.1.0"
description = "AI Company OS orchestration core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn>=0.29",
]

[project.scripts]
aico = "aico.app.cli:main"
aico-audit = "aico.app.audit_cli:main"
aico-benchmark = "aico.app.boss_absent_benchmark_cli:main"
aico-dead-man-evidence = "aico.app.dead_man_evidence_cli:main"
aico-commission = "aico.app.runtime_commissioning_cli:main"
aico-dead-man-recovery = "aico.app.dead_man_receiver_recovery_cli:main"
aico-dead-man-receiver = "aico.app.dead_man_receiver_app:main"
aico-feishu-webhook = "aico.app.feishu_webhook:main"
aico-github-social-preview = "aico.app.social_preview_cli:main"
aico-glance = "aico.app.glance_cli:main"
aico-metrics = "aico.app.metrics_cli:main"
aico-memory = "aico.app.memory_cli:main"
aico-phase1 = "aico.app.phase1:main"
aico-recovery = "aico.app.recovery_cli:main"
aico-release-room-demo = "aico.app.release_room_demo:main"
aico-service = "aico.app.service_cli:main"
aico-state = "aico.app.state_cli:main"
aico-view = "aico.app.view_cli:main"

[dependency-groups]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aico"]

[tool.pytest.ini_options]
testpaths = ["tests", "projects/sme-agent/tests", "projects/data-agent-v1/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src", "tests"]
