    <text x="535" y="516" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="18" fill="#cbd5e1">人工复核交付</text>
    <text x="535" y="552" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
