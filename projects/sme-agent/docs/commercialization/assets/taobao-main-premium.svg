    <rect x="106" y="370" width="190" height="16" rx="8" fill="#1e3a8a"/>
    <rect x="106" y="410" width="330" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="106" y="442" width="280" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="106" y="502" width="118" height="82" rx="18" fill="#eff6ff"/>
    <rect x="242" y="502" width="118" height="82" rx="18" fill="#eef2ff"/>
    <rect x="378" y="502" width="88" height="82" rx="18" fill="#f8fafc"/>
    <text x="126" y="546" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
