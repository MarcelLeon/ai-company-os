<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e8eef7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1f2a44" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="800" height="800" rx="44" fill="url(#bg)"/>
  <circle cx="680" cy="120" r="120" fill="#dbeafe" opacity="0.65"/>
  <circle cx="90" cy="690" r="150" fill="#e0e7ff" opacity="0.55"/>

  <text x="72" y="92" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
