  </g>

  <g filter="url(#shadow)">
    <rect x="505" y="385" width="220" height="210" rx="26" fill="#0f172a"/>
    <text x="535" y="438" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
